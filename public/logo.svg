<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F3A45"/>
      <stop offset="0.5" stop-color="#0B2530"/>
      <stop offset="1" stop-color="#071821"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#22E0F0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22E0F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trunk" gradientUnits="userSpaceOnUse" x1="0" y1="230" x2="0" y2="800">
      <stop offset="0" stop-color="#7AF4FC"/>
      <stop offset="1" stop-color="#22E0F0"/>
    </linearGradient>
    <linearGradient id="bowl" gradientUnits="userSpaceOnUse" x1="400" y1="430" x2="700" y2="780">
      <stop offset="0" stop-color="#C4B1FF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#halo)"/>
  <rect x="70" y="70" width="884" height="884" rx="218" fill="none" stroke="#22E0F0" stroke-opacity="0.3" stroke-width="10"/>

  <!-- The "b": a branch that leaves the trunk and merges back -->
  <g fill="none" stroke-linecap="round" stroke-width="64">
    <path d="M404 520 C 470 468, 700 472, 700 640 C 700 800, 470 800, 404 772" stroke="url(#bowl)"/>
    <path d="M404 300 V 772" stroke="url(#trunk)"/>
  </g>

  <!-- Nodes -->
  <circle cx="404" cy="272" r="68" fill="#071821" stroke="#22E0F0" stroke-width="42"/>
  <circle cx="700" cy="640" r="74" fill="#0B2530"/>
  <circle cx="700" cy="640" r="52" fill="#A78BFA"/>
  <circle cx="404" cy="772" r="96" fill="#22E0F0" opacity="0.55" filter="url(#glow)"/>
  <circle cx="404" cy="772" r="82" fill="#22E0F0"/>
  <circle cx="404" cy="772" r="34" fill="#071821"/>
</svg>
