[package]
name = "branchly"
description = "A lightweight, modern desktop Git client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "branchly"

[lib]
name = "branchly_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
branchly-core.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
thiserror.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
specta-typescript = "=0.0.9"
notify = "8.2"
notify-debouncer-full = "0.7"

[lints]
workspace = true
