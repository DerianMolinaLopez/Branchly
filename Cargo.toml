[workspace]
resolver = "3"
members = ["crates/branchly-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
authors = ["Branchly contributors"]

[workspace.dependencies]
branchly-core = { path = "crates/branchly-core" }
# Network transports are delegated to the git CLI, so libgit2 is built without
# HTTPS/SSH support: no OpenSSL or libssh2 linkage and a smaller binary.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
thiserror = "2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Hot paths (revwalk, lane layout, diffing) favour speed over size.
[profile.release.package.branchly-core]
opt-level = 3

[profile.release.package.libgit2-sys]
opt-level = 3
