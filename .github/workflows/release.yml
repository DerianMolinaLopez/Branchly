name: Release

# Publishes the Linux executables when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# The build runs in the same Ubuntu 22.04 container as scripts/build-linux.sh,
# so CI and local builds produce identical, portable artifacts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (AppImage, .deb, .rpm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build in the Ubuntu 22.04 container
        run: scripts/build-linux.sh

      - name: Upload artifacts to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: branchly-linux
          path: dist-linux/*

      - name: Create a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Branchly ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: dist-linux/*
